[project]
name = "abhack"
version = "0.1.0"
description = "Oslo Antibodies x AI hackathon: trastuzumab/HER2 design pipeline"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.17",
    "pandas>=2.2",
    "numpy>=2.0",
    "pyarrow>=18",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "gemmi>=0.7",
    "biopython>=1.84",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "typer>=0.15",
    "immunum==2.0.0",
    "openmm>=8.2",
    "pdbfixer>=1.9",
    "mdtraj>=1.10",
]

[project.optional-dependencies]
ml = ["lightgbm>=4.5", "torch>=2.5", "transformers>=4.46"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abhack"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
